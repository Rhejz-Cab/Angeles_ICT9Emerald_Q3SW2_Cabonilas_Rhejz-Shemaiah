<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Q3 Seatwork 2</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>


body{
background-image: url("parfume.png");
background-repeat: no-repeat;
background-position: center;
background-size: cover;
background-attachment: fixed;
font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
text-align:center;
}

.container-box{
margin-top:80px;
background:rgb(255, 151, 164);
padding:40px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

h1{
color:#7f2958;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#333;
}
</style>

</head>

<body>

<div class="container">

<div class="container-box">

<h1>🌸 Perfume Finder</h1>
<h4>Product Locator</h4>

<p>Enter your budget and we will recommend a perfume you might like.</p>

<input type="number" id="budget" class="form-control mb-3" placeholder="Enter your budget">

<button class="btn btn-danger" onclick="findPerfume()">Find My Perfume</button>

<div class="result" id="output"></div>

<p class="mt-4">
Learn more about perfumes here:
<a href="https://www.fragrantica.com" target="_blank">Visit Fragrantica</a>
</p>

</div>
</div>
<script>

function findPerfume(){

let budget = document.getElementById("budget").value;

let recommendation = "";

if(budget >= 5000){
recommendation = "Recommended: Luxury Perfume (Chanel or Dior)";
}

else if(budget >= 2500){
recommendation = "Recommended: Mid-range Perfume (Versace or Calvin Klein)";
}

else if(budget >= 1000){
recommendation = "Recommended: Budget Perfume (Zara or Bench)";
}

else{
recommendation = "Budget too low. Try increasing your budget.";
}


document.getElementById("output").innerHTML = recommendation;
}

</script>
</body>
</html>
